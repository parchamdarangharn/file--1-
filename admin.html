```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پنل مدیریت</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<section class="admin-page">

    <h1 class="heading">پنل مدیریت</h1>

    <h3 class="title">مدیریت ویدیوها</h3>

    <!-- آپلود ویدیو -->
    <div class="admin-box">

        <form action="/upload" method="POST" enctype="multipart/form-data">

            <label for="video">انتخاب ویدیو:</label>

            <input
                type="file"
                id="video"
                name="video"
                accept="video/*"
                required
            >

            <button type="submit" class="btn">
                آپلود ویدیو
            </button>

        </form>

    </div>


    <!-- لیست ویدیوها -->
    <div class="admin-box">

        <h3>ویدیوهای آپلود شده</h3>

        <div id="video-list">
            در حال دریافت ویدیوها...
        </div>

    </div>

</section>


<script>

async function loadVideos() {

    const videoList = document.getElementById("video-list");

    try {

        const response = await fetch("/admin/videos");

        const data = await response.json();

        videoList.innerHTML = "";

        if (data.videos.length === 0) {

            videoList.innerHTML = "<p>هنوز ویدیویی آپلود نشده است.</p>";

            return;
        }

        data.videos.forEach(function(video) {

            const box = document.createElement("div");

            box.style.marginBottom = "15px";

            box.innerHTML = `
                <span>${video}</span>

                <form
                    action="/delete/${encodeURIComponent(video)}"
                    method="POST"
                    style="display:inline; margin-right:10px;"
                >

                    <button type="submit" class="btn">
                        🗑️ حذف
                    </button>

                </form>
            `;

            videoList.appendChild(box);

        });

    } catch (error) {

        videoList.innerHTML =
            "<p>خطا در دریافت لیست ویدیوها.</p>";

    }

}

loadVideos();

</script>

</body>
</html>
```
